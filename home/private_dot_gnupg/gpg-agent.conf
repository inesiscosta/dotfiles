# Cache the passphrase for 8 hours after last use, and never longer than
# 24 hours in total. (Previously 400 days, which made a stolen unlocked
# laptop equivalent to a stolen key.)
default-cache-ttl 28800
max-cache-ttl 86400

# Installed as a dependency of Homebrew's gnupg.
pinentry-program /opt/homebrew/bin/pinentry
